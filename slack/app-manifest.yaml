_metadata:
  major_version: 1

display_information:
  name: Agent Foundry
  description: Control and monitor autonomous Agent Foundry development workflows from Slack.
  background_color: "#1f2937"

features:
  bot_user:
    display_name: Agent Foundry
    always_online: false
  slash_commands:
    - command: /foundry
      description: Open the Agent Foundry control panel.
      usage_hint: help
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write

settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  is_hosted: false
  token_rotation_enabled: false
